<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F4F1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..900&family=Alexandria:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <title>dvote</title>
    <script>
      // the saved language (or the phone's) before the first paint: Arabic is right-to-left at once
      try {
        var l = localStorage.getItem('dvote-web-language') || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
