<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>dvote dashboard</title>
    <script>
      // apply the saved theme before the first paint (see src/lib/theme.tsx)
      try {
        // and the saved language (see src/i18n): Arabic is right-to-left from the first paint
        if (localStorage.getItem('dvote-dashboard-language') === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
        var t = localStorage.getItem('dvote-dashboard-theme');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
