<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F1EE" />
    <meta name="description" content="dvote: loyalty cards in your customers' Google Wallet. No app to install. Tap or scan at the till, collect points, get rewards." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>dvote · Loyalty cards in your customers' wallet</title>
    <script>
      // saved language (or the browser's) before the first paint: Arabic is right-to-left at once
      try {
        var l = localStorage.getItem('dvote-landing-language') || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
