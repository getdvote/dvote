<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F4F1" />
    <meta name="description" content="dvote: كروت ولاء في محفظة زباينك على Google Wallet. من غير أبلكيشن. لمسة أو سكان عند الكاشير، يجمعوا نقاط ويرجعوا تاني." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..900&family=Alexandria:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <title>dvote · كروت الولاء في محفظة زباينك</title>
    <script>
      // Arabic is the default, so only a saved English choice changes it before the first paint
      try {
        if (localStorage.getItem('dvote-landing-language') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.title = "dvote · Loyalty cards in your customers' wallet";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
